<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Aktuelle Buchtipps vom Schnelsener Büchereck – per QR-Code direkt im Onlineshop bestellen und im Laden abholen."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://schaufenster.vercel.app/" />
    <meta property="og:title" content="Schnelsener Büchereck · Direkt aus dem Schaufenster bestellen" />
    <meta property="og:description" content="Buchtipps scannen, online bestellen und im Laden abholen." />
    <meta property="og:image" content="https://schaufenster.vercel.app/og.png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:image:alt" content="Schnelsener Büchereck: Bücher direkt aus dem Schaufenster bestellen." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Schnelsener Büchereck · Direkt aus dem Schaufenster bestellen" />
    <meta name="twitter:description" content="Buchtipps scannen, online bestellen und im Laden abholen." />
    <meta name="twitter:image" content="https://schaufenster.vercel.app/og.png" />
    <title>Schnelsener Büchereck · Direkt aus dem Schaufenster bestellen</title>
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section class="slide is-active" id="slide" aria-label="Aktueller Schaufenster-Tipp">
        <p class="eyebrow" id="eyebrow"></p>
        <div class="visual" id="visual" aria-hidden="true"></div>
        <div class="copy">
          <p class="kicker" id="kicker"></p>
          <h1 id="title"></h1>
          <p class="author" id="author"></p>
          <p class="audience" id="audience"></p>
          <p class="focus" id="focus"></p>
          <p class="note" id="note"></p>
          <section class="order-panel" id="orderPanel" aria-label="Direkt im Onlineshop bestellen" hidden>
            <div class="order-panel__qr">
              <img id="orderQr" alt="" width="256" height="256" />
            </div>
            <div class="order-panel__content">
              <p class="order-panel__eyebrow">Jetzt bestellen</p>
              <p class="order-panel__title" id="orderTitle"></p>
              <p class="order-panel__availability" id="orderAvailability"></p>
              <p class="order-panel__detail" id="orderDetail"></p>
              <a class="order-panel__link" id="orderLink" target="_blank" rel="noopener noreferrer">Im Shop öffnen</a>
              <p class="order-panel__progress" id="orderProgress"></p>
            </div>
          </section>
        </div>
        <div class="slide-controls" aria-label="Diashow-Steuerung">
          <span class="slide-progress" id="slideProgress"></span>
          <button class="pause-button" id="pauseToggle" type="button" aria-label="Diashow pausieren" title="Diashow pausieren">
            <span aria-hidden="true">Ⅱ</span>
          </button>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="nav-zone nav-zone--previous">
          <button class="nav-button" id="previousSlide" type="button" aria-label="Vorherige Folie">
            <span aria-hidden="true">&lsaquo;</span>
          </button>
        </div>
        <div class="nav-zone nav-zone--next">
          <button class="nav-button" id="nextSlide" type="button" aria-label="Nächste Folie">
            <span aria-hidden="true">&rsaquo;</span>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
